<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego de la Serpiente - Taller</title>
  <link rel="stylesheet" href="serpiente.css">
</head>
<body>
  <main class="contenedor-juego">
    <h1>🦖 Yoshi Snake</h1>
    <p class="descripcion">
      Ayuda a Yoshi a comer manzanas sin chocar con los bordes
    </p>

    <section class="panel-info">
      <div class="tarjeta-info">
        <span>Puntaje</span>
        <strong id="puntaje">0</strong>
      </div>
      <!-- tarjeta de nivel -->
      <div class="tarjeta-info">
        <span>Nivel</span>
        <strong id="nivel">0</strong>
      </div>

      <!-- tarjeta de tiempo -->
      <div class="tarjeta-info">
        <span>Tiempo</span>
        <strong id="tiempo">00:00</strong>
      </div>

      <div class="tarjeta-info">
        <span>Estado</span>
        <strong id="estado">Listo</strong>
      </div>
    </section>

    <canvas id="canvasJuego" width="600" height="600" background="red"></canvas>

    <section class="controles">
      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('arriba');this.blur()">⬆️</button>
      <button class="vacio">-</button>

      <button onclick="cambiarDireccion('izquierda'); this.blur()">⬅️</button>
      <button onclick="pausarJuego(); this.blur()">⏸️</button>
      <button onclick="cambiarDireccion('derecha'); this.blur()">➡️</button>

      <button class="vacio">-</button>
      <button onclick="cambiarDireccion('abajo'); this.blur()">⬇️</button>
      <button class="vacio">-</button>
    </section>

    <section class="acciones">
      <button onclick="iniciarJuego(); this.blur()">Iniciar</button>
      <button class="secundario" onclick="reiniciarJuego(); this.blur()">Reiniciar</button>
    </section>

    <p id="mensaje" class="mensaje">Presiona iniciar para comenzar.</p>
  </main>

      <!-- SONIDOS -->
    <audio id="musicaFondo" loop>
      <source src="musica.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonidoComer">
      <source src="comer.mp3" type="audio/mpeg">
    </audio>
    <audio id="sonidoGameOver">
      <source src="gameover.mp3" type="audio/mpeg">
    </audio>

  <script src="serpiente.js"></script>
</body>
</html>
